<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, breadcrumb, content)">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Админ-панель</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body class="admin-body">
<div class="admin-layout">

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand-icon">R</div>
            <div>
                <h2>RestaurantApp</h2>
                <p>Admin Panel</p>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a class="nav-item active" th:href="@{/admin/news}">
                <span class="nav-dot"></span>
                Новости
            </a>

            <span class="nav-item disabled">
                <span class="nav-dot"></span>
                Рестораны
            </span>

            <span class="nav-item disabled">
                <span class="nav-dot"></span>
                Пользователи
            </span>
        </nav>

        <form th:action="@{/admin/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">Выйти</button>
        </form>
    </aside>

    <div class="page-wrapper">
        <header class="topbar">
            <div>
                <p class="breadcrumb" th:text="${breadcrumb}">
                    Главная / Новости
                </p>
                <h1 th:text="${title}">Новости</h1>
            </div>
        </header>

        <main class="content" th:replace="${content}">
            Контент страницы
        </main>
    </div>

</div>
</body>
</html>
