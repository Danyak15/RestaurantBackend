<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<body>
<div th:replace="~{admin/layout :: layout(${pageTitle}, ${breadcrumb}, ~{::section})}">

    <section>
        <div class="page-actions">
            <div>
                <h2 th:text="${pageTitle}">Ресторан</h2>
                <p>Заполните данные ресторана для отображения в Android-приложении.</p>
            </div>
        </div>

        <div class="admin-card form-card">
            <form th:action="${formAction}"
                  th:object="${request}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="form-group">
                    <label for="name">Название</label>
                    <input id="name"
                           type="text"
                           th:field="*{name}"
                           placeholder="Например: Meat House"
                           required>
                </div>

                <div class="form-group">
                    <label for="cuisine">Кухня</label>
                    <input id="cuisine"
                           type="text"
                           th:field="*{cuisine}"
                           placeholder="Например: Европейская кухня"
                           required>
                </div>

                <div class="form-group">
                    <label for="address">Адрес</label>
                    <input id="address"
                           type="text"
                           th:field="*{address}"
                           placeholder="г. Москва, ул. ..."
                           required>
                </div>

                <div class="form-group">
                    <label for="description">Описание</label>
                    <textarea id="description"
                              th:field="*{description}"
                              placeholder="Краткое описание ресторана"
                              required></textarea>
                </div>

                <div class="form-group">
                    <label for="rating">Рейтинг</label>
                    <input id="rating"
                           type="number"
                           step="0.1"
                           min="0"
                           max="5"
                           th:field="*{rating}"
                           required>
                </div>

                <div class="form-group">
                    <label for="phone">Телефон</label>
                    <input id="phone"
                           type="text"
                           th:field="*{phone}"
                           placeholder="+79991234567">

                    <p class="field-error"
                       th:if="${#fields.hasErrors('phone')}"
                       th:errors="*{phone}">
                    </p>
                </div>

                <div class="form-group" th:if="${isEdit}">
                    <label>Текущее фото</label>
                    <img class="current-image"
                         th:if="${currentImageUrl}"
                         th:src="@{${currentImageUrl}}"
                         alt="Фото ресторана">
                </div>

                <div class="form-group">
                    <label for="imageFile">Фото ресторана</label>
                    <input id="imageFile"
                           type="file"
                           name="imageFile"
                           accept="image/*"
                           th:required="${!isEdit}">

                    <p class="field-error"
                       th:if="${imageError}"
                       th:text="${imageError}">
                    </p>
                </div>

                <div class="form-section">
                    <h3>Часы работы</h3>
                    <p>Для каждого дня укажите, работает ресторан или нет.</p>
                </div>

                <div class="hours-list">
                    <div class="hours-row"
                         th:each="hour, iter : *{workingHours}">

                        <input type="hidden"
                               th:field="*{workingHours[__${iter.index}__].dayOfWeek}">

                        <div class="hours-day"
                             th:text="${dayNames[hour.dayOfWeek]}">
                            Понедельник
                        </div>

                        <label class="hours-closed">
                            <input type="checkbox"
                                   class="closed-checkbox"
                                   th:field="*{workingHours[__${iter.index}__].isClosed}">
                            Выходной
                        </label>

                        <div class="hours-time-block">
                            <div class="hours-time">
                                <label>Открытие</label>
                                <input type="time"
                                       class="time-input"
                                       th:field="*{workingHours[__${iter.index}__].openTime}">
                            </div>

                            <div class="hours-time">
                                <label>Закрытие</label>
                                <input type="time"
                                       class="time-input"
                                       th:field="*{workingHours[__${iter.index}__].closeTime}">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <a class="secondary-button" th:href="@{/admin/restaurants}">
                        Назад
                    </a>

                    <button class="primary-button" type="submit">
                        Сохранить
                    </button>
                </div>
            </form>
        </div>
    </section>

</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const rows = document.querySelectorAll(".hours-row");

        rows.forEach(row => {
            const checkbox = row.querySelector(".closed-checkbox");
            const timeBlock = row.querySelector(".hours-time-block");
            const timeInputs = row.querySelectorAll(".time-input");

            function updateState() {
                const isClosed = checkbox.checked;

                timeBlock.style.display = isClosed ? "none" : "grid";

                timeInputs.forEach(input => {
                    input.disabled = isClosed;

                    if (isClosed) {
                        input.value = "";
                    }
                });
            }

            checkbox.addEventListener("change", updateState);
            updateState();
        });
    });
</script>
</body>
</html>
