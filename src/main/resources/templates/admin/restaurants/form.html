<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<body>
<div th:replace="~{admin/layout :: layout(${pageTitle}, ${breadcrumb}, ~{::section})}">

    <section>
        <div class="page-actions">
            <div>
                <h2 th:text="${pageTitle}">Ресторан</h2>
                <p>Заполните данные ресторана для отображения в Android-приложении.</p>
            </div>
        </div>

        <div class="admin-card form-card">
            <form th:action="${formAction}"
                  th:object="${request}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="form-group">
                    <label for="name">Название</label>
                    <input id="name"
                           type="text"
                           th:field="*{name}"
                           placeholder="Например: Meat House"
                           required>
                </div>

                <div class="form-group">
                    <label for="cuisine">Кухня</label>
                    <input id="cuisine"
                           type="text"
                           th:field="*{cuisine}"
                           placeholder="Например: Европейская кухня"
                           required>
                </div>

                <div class="form-group">
                    <label for="address">Адрес</label>
                    <input id="address"
                           type="text"
                           th:field="*{address}"
                           placeholder="г. Москва, ул. ..."
                           required>
                </div>

                <div class="form-group">
                    <label for="description">Описание</label>
                    <textarea id="description"
                              th:field="*{description}"
                              placeholder="Краткое описание ресторана"
                              required></textarea>
                </div>

                <div class="form-group">
                    <label for="rating">Рейтинг</label>
                    <input id="rating"
                           type="number"
                           step="0.1"
                           min="0"
                           max="5"
                           th:field="*{rating}"
                           required>
                </div>

                <div class="form-group">
                    <label for="phone">Телефон</label>
                    <input id="phone"
                           type="text"
                           th:field="*{phone}"
                           placeholder="+79991234567">

                    <p class="field-error"
                       th:if="${#fields.hasErrors('phone')}"
                       th:errors="*{phone}">
                    </p>
                </div>

                <div class="form-group" th:if="${isEdit}">
                    <label>Текущее фото</label>
                    <img class="current-image"
                         th:if="${currentImageUrl}"
                         th:src="@{${currentImageUrl}}"
                         alt="Фото ресторана">
                </div>

                <div class="form-group">
                    <label for="imageFile">Фото ресторана</label>
                    <input id="imageFile"
                           type="file"
                           name="imageFile"
                           accept="image/*"
                           th:required="${!isEdit}">

                    <p class="field-error"
                       th:if="${imageError}"
                       th:text="${imageError}">
                    </p>
                </div>

                <div class="form-section">
                    <h3>Часы работы</h3>
                    <p>Для каждого дня укажите, работает ресторан или нет.</p>
                </div>

                <div class="hours-list">
                    <div class="hours-row"
                         th:each="hour, iter : *{workingHours}">

                        <input type="hidden"
                               th:field="*{workingHours[__${iter.index}__].dayOfWeek}">

                        <div class="hours-day"
                             th:text="${dayNames[hour.dayOfWeek]}">
                            Понедельник
                        </div>

                        <label class="hours-closed">
                            <input type="checkbox"
                                   class="closed-checkbox"
                                   th:field="*{workingHours[__${iter.index}__].isClosed}">
                            Выходной
                        </label>

                        <div class="hours-time-block">
                            <div class="hours-time">
                                <label>Открытие</label>
                                <input type="time"
                                       class="time-input"
                                       th:field="*{workingHours[__${iter.index}__].openTime}">
                            </div>

                            <div class="hours-time">
                                <label>Закрытие</label>
                                <input type="time"
                                       class="time-input"
                                       th:field="*{workingHours[__${iter.index}__].closeTime}">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="restaurant-tables-section" th:if="${!isEdit}">
                    <div class="form-section">
                        <h3>Столики</h3>
                    </div>

                    <div class="restaurant-tables-list" id="restaurantTablesList">
                        <div class="restaurant-table-row"
                             th:each="table, iter : *{tables}"
                             data-table-row>

                            <div class="form-group">
                                <label data-capacity-label
                                       th:for="|tables-${iter.index}-capacity|">Количество гостей</label>
                                <input th:id="|tables-${iter.index}-capacity|"
                                       data-capacity-input
                                       type="number"
                                       min="1"
                                       th:field="*{tables[__${iter.index}__].capacity}"
                                       required>

                                <p class="field-error"
                                   th:if="${#fields.hasErrors('tables[' + iter.index + '].capacity')}"
                                   th:errors="*{tables[__${iter.index}__].capacity}">
                                </p>
                            </div>

                            <div class="form-group">
                                <label data-quantity-label
                                       th:for="|tables-${iter.index}-quantity|">Количество столиков</label>
                                <input th:id="|tables-${iter.index}-quantity|"
                                       data-quantity-input
                                       type="number"
                                       min="1"
                                       th:field="*{tables[__${iter.index}__].quantity}"
                                       required>

                                <p class="field-error"
                                   th:if="${#fields.hasErrors('tables[' + iter.index + '].quantity')}"
                                   th:errors="*{tables[__${iter.index}__].quantity}">
                                </p>
                            </div>

                            <button class="table-remove-button" type="button" data-remove-table>
                                Удалить
                            </button>
                        </div>
                    </div>

                    <p class="field-error"
                       th:if="${#fields.hasErrors('tables')}"
                       th:errors="*{tables}">
                    </p>

                    <button class="secondary-button table-add-button" type="button" id="addRestaurantTable">
                        Добавить столик
                    </button>
                </div>

                <div class="form-actions">
                    <a class="secondary-button" th:href="@{/admin/restaurants}">
                        Назад
                    </a>

                    <button class="primary-button" type="submit">
                        Сохранить
                    </button>
                </div>
            </form>
        </div>
    </section>

</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const rows = document.querySelectorAll(".hours-row");

        rows.forEach(row => {
            const checkbox = row.querySelector(".closed-checkbox");
            const timeBlock = row.querySelector(".hours-time-block");
            const timeInputs = row.querySelectorAll(".time-input");

            function updateState() {
                const isClosed = checkbox.checked;

                timeBlock.style.display = isClosed ? "none" : "grid";

                timeInputs.forEach(input => {
                    input.disabled = isClosed;

                    if (isClosed) {
                        input.value = "";
                    }
                });
            }

            checkbox.addEventListener("change", updateState);
            updateState();
        });

        const tablesList = document.getElementById("restaurantTablesList");
        const addTableButton = document.getElementById("addRestaurantTable");

        function updateTableRows() {
            if (!tablesList) {
                return;
            }

            const rows = tablesList.querySelectorAll("[data-table-row]");

            rows.forEach((row, index) => {
                const capacityLabel = row.querySelector("[data-capacity-label]");
                const capacityInput = row.querySelector("[data-capacity-input]");
                const quantityLabel = row.querySelector("[data-quantity-label]");
                const quantityInput = row.querySelector("[data-quantity-input]");
                const removeButton = row.querySelector("[data-remove-table]");

                if (capacityLabel && capacityInput) {
                    capacityLabel.setAttribute("for", `tables-${index}-capacity`);
                    capacityInput.id = `tables-${index}-capacity`;
                    capacityInput.name = `tables[${index}].capacity`;
                }

                if (quantityLabel && quantityInput) {
                    quantityLabel.setAttribute("for", `tables-${index}-quantity`);
                    quantityInput.id = `tables-${index}-quantity`;
                    quantityInput.name = `tables[${index}].quantity`;
                }

                if (removeButton) {
                    removeButton.disabled = rows.length === 1;
                }
            });
        }

        function createTableRow(index) {
            const row = document.createElement("div");
            row.className = "restaurant-table-row";
            row.dataset.tableRow = "";

            row.innerHTML = `
                <div class="form-group">
                    <label data-capacity-label for="tables-${index}-capacity">Количество гостей</label>
                    <input id="tables-${index}-capacity"
                           data-capacity-input
                           type="number"
                           min="1"
                           name="tables[${index}].capacity"
                           value="2"
                           required>
                </div>

                <div class="form-group">
                    <label data-quantity-label for="tables-${index}-quantity">Количество столиков</label>
                    <input id="tables-${index}-quantity"
                           data-quantity-input
                           type="number"
                           min="1"
                           name="tables[${index}].quantity"
                           value="1"
                           required>
                </div>

                <button class="table-remove-button" type="button" data-remove-table>
                    Удалить
                </button>
            `;

            return row;
        }

        if (tablesList && addTableButton) {
            addTableButton.addEventListener("click", function () {
                const index = tablesList.querySelectorAll("[data-table-row]").length;
                tablesList.appendChild(createTableRow(index));
                updateTableRows();
            });

            tablesList.addEventListener("click", function (event) {
                const removeButton = event.target.closest("[data-remove-table]");

                if (!removeButton) {
                    return;
                }

                const rows = tablesList.querySelectorAll("[data-table-row]");

                if (rows.length === 1) {
                    return;
                }

                removeButton.closest("[data-table-row]").remove();
                updateTableRows();
            });

            updateTableRows();
        }
    });
</script>
</body>
</html>
