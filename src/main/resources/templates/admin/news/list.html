<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<body>
<div th:replace="~{admin/layout :: layout(${pageTitle}, ${breadcrumb}, ~{::section})}">

    <section>
        <div class="page-actions">
            <div>
                <h2>Список новостей</h2>
                <p>Здесь отображаются новости, которые видит пользователь в Android-приложении.</p>
            </div>

            <a class="primary-button" th:href="@{/admin/news/create}">
                Добавить новость
            </a>
        </div>

        <div class="admin-card">
            <div class="table-wrapper">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Заголовок</th>
                        <th>Описание</th>
                        <th>Дата создания</th>
                        <th>Действия</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="news : ${newsList}">
                        <td th:text="${news.id}"></td>

                        <td class="news-title" th:text="${news.title}"></td>

                        <td class="news-content" th:text="${news.content}"></td>

                        <td th:text="${news.createdAt}"></td>

                        <td>
                            <div class="actions">
                                <a class="edit-button"
                                   th:href="@{/admin/news/{id}/edit(id=${news.id})}">
                                    Изменить
                                </a>

                                <form th:action="@{/admin/news/{id}/delete(id=${news.id})}"
                                      method="post">
                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">
                                    <button class="delete-button"
                                            type="submit"
                                            onclick="return confirm('Удалить новость?')">
                                        Удалить
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <p th:if="${#lists.isEmpty(newsList)}" class="empty-text">
                Новостей пока нет
            </p>
        </div>
    </section>

</div>
</body>
</html>
