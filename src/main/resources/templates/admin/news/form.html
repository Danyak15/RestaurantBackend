<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<body>
<div th:replace="~{admin/layout :: layout(${pageTitle}, ${breadcrumb}, ~{::section})}">

    <section>
        <div class="page-actions">
            <div>
                <h2 th:text="${pageTitle}">Создание новости</h2>
                <p>Заполните данные, которые будут отображаться в разделе новостей приложения.</p>
            </div>
        </div>

        <div class="admin-card form-card">
            <p class="form-error"
               th:if="${formError}"
               th:text="${formError}">
            </p>

            <form th:action="${formAction}"
                  th:object="${request}"
                  method="post"
                  enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="form-group">
                    <label for="restaurantId">Ресторан</label>
                    <select id="restaurantId" th:field="*{restaurantId}">
                        <option value="">Все рестораны</option>
                        <option th:each="restaurant : ${restaurants}"
                                th:value="${restaurant.id}"
                                th:text="${restaurant.name}">
                            Ресторан
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="title">Заголовок</label>
                    <input id="title"
                           type="text"
                           th:field="*{title}"
                           placeholder="Например: Новое сезонное меню"
                           required>

                    <p class="field-error"
                       th:if="${#fields.hasErrors('title')}"
                       th:errors="*{title}">
                    </p>
                </div>

                <div class="form-group">
                    <label for="content">Описание</label>
                    <textarea id="content"
                              th:field="*{content}"
                              placeholder="Введите описание новости"
                              required></textarea>

                    <p class="field-error"
                       th:if="${#fields.hasErrors('content')}"
                       th:errors="*{content}">
                    </p>
                </div>

                <div class="form-group" th:if="${isEdit}">
                    <label>Текущее фото</label>
                    <img class="current-image"
                         th:if="${currentImageUrl}"
                         th:src="@{${currentImageUrl}}"
                         alt="Фото новости">
                </div>

                <div class="form-group">
                    <label for="imageFile">Фото новости</label>
                    <input id="imageFile"
                           type="file"
                           name="imageFile"
                           accept="image/*"
                           th:required="${!isEdit}">

                    <p class="field-error"
                       th:if="${imageError}"
                       th:text="${imageError}">
                    </p>
                </div>

                <div class="form-actions">
                    <a class="secondary-button" th:href="@{/admin/news}">
                        Назад
                    </a>

                    <button class="primary-button" type="submit">
                        Сохранить
                    </button>
                </div>
            </form>
        </div>
    </section>

</div>
</body>
</html>
