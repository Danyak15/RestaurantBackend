<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<body>
<div th:replace="~{admin/layout :: layout(${pageTitle}, ${breadcrumb}, ~{::section})}">

    <section>
        <div class="page-actions">
            <div>
                <h2 th:text="${pageTitle}">Создание новости</h2>
                <p>Заполните данные, которые будут отображаться в разделе новостей приложения.</p>
            </div>
        </div>

        <div class="admin-card form-card">
            <form th:action="${formAction}" th:object="${request}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="form-group">
                    <label for="title">Заголовок</label>
                    <input id="title"
                           type="text"
                           th:field="*{title}"
                           placeholder="Например: Новое сезонное меню"
                           required>
                </div>

                <div class="form-group">
                    <label for="content">Описание</label>
                    <textarea id="content"
                              th:field="*{content}"
                              placeholder="Введите описание новости"
                              required></textarea>
                </div>

                <div class="form-actions">
                    <a class="secondary-button" th:href="@{/admin/news}">
                        Назад
                    </a>

                    <button class="primary-button" type="submit">
                        Сохранить
                    </button>
                </div>
            </form>
        </div>
    </section>

</div>
</body>
</html>
