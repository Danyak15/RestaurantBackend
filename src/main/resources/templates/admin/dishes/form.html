<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<body>
<div th:replace="~{admin/layout :: layout(${pageTitle}, ${breadcrumb}, ~{::section})}">

    <section>
        <div class="page-actions">
            <div>
                <h2 th:text="${pageTitle}">Блюдо</h2>
                <p th:text="'Категория: ' + ${category.name} + ', ресторан: ' + ${restaurant.name}">
                    Категория
                </p>
            </div>
        </div>

        <div class="admin-card form-card">
            <p class="form-error"
               th:if="${formError}"
               th:text="${formError}">
            </p>

            <form th:action="${formAction}"
                  th:object="${request}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="form-group">
                    <label for="name">Название блюда</label>
                    <input id="name"
                           type="text"
                           th:field="*{name}"
                           placeholder="Например: Цезарь с курицей"
                           required>

                    <p class="field-error"
                       th:if="${#fields.hasErrors('name')}"
                       th:errors="*{name}">
                    </p>
                </div>

                <div class="form-group">
                    <label for="price">Цена</label>
                    <input id="price"
                           type="number"
                           step="0.01"
                           min="0"
                           th:field="*{price}"
                           required>

                    <p class="field-error"
                       th:if="${#fields.hasErrors('price')}"
                       th:errors="*{price}">
                    </p>
                </div>

                <div class="form-group">
                    <label for="weight">Вес, г</label>
                    <input id="weight"
                           type="number"
                           min="0"
                           th:field="*{weight}"
                           placeholder="Например: 250">

                    <p class="field-error"
                       th:if="${#fields.hasErrors('weight')}"
                       th:errors="*{weight}">
                    </p>
                </div>

                <div class="form-group">
                    <label for="description">Описание</label>
                    <textarea id="description"
                              th:field="*{description}"
                              placeholder="Описание блюда"
                              required></textarea>

                    <p class="field-error"
                       th:if="${#fields.hasErrors('description')}"
                       th:errors="*{description}">
                    </p>
                </div>

                <div class="form-group">
                    <label for="displayOrder">Порядок отображения</label>
                    <input id="displayOrder"
                           type="number"
                           min="0"
                           th:field="*{displayOrder}"
                           required>

                    <p class="field-error"
                       th:if="${#fields.hasErrors('displayOrder')}"
                       th:errors="*{displayOrder}">
                    </p>
                </div>

                <div class="form-group" th:if="${isEdit}">
                    <label>Текущее фото</label>
                    <img class="current-image"
                         th:if="${currentImageUrl}"
                         th:src="@{${currentImageUrl}}"
                         alt="Фото блюда">
                </div>

                <div class="form-group">
                    <label for="imageFile">Фото блюда</label>
                    <input id="imageFile"
                           type="file"
                           name="imageFile"
                           accept="image/*"
                           th:required="${!isEdit}">

                    <p class="field-error"
                       th:if="${imageError}"
                       th:text="${imageError}">
                    </p>
                </div>

                <div class="form-actions">
                    <a class="secondary-button"
                       th:href="@{/admin/restaurants/{restaurantId}/categories/{categoryId}/dishes(restaurantId=${restaurant.id}, categoryId=${category.id})}">
                        Назад
                    </a>

                    <button class="primary-button" type="submit">
                        Сохранить
                    </button>
                </div>
            </form>
        </div>
    </section>

</div>
</body>
</html>
