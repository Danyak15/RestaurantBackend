<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<body>
<div th:replace="~{admin/layout :: layout(${pageTitle}, ${breadcrumb}, ~{::section})}">

    <section>
        <div class="page-actions">
            <div>
                <h2 th:text="'Категории: ' + ${restaurant.name}">Категории</h2>
                <p>Управление разделами меню выбранного ресторана.</p>
            </div>

            <a class="primary-button"
               th:href="@{/admin/restaurants/{restaurantId}/categories/create(restaurantId=${restaurant.id})}">
                Добавить категорию
            </a>
        </div>

        <div class="admin-card">
            <div class="table-wrapper">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Порядок</th>
                        <th>Название</th>
                        <th>Действия</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="category : ${categories}">
                        <td th:text="${category.id}"></td>
                        <td th:text="${category.displayOrder}"></td>
                        <td class="news-title" th:text="${category.name}"></td>

                        <td>
                            <div class="actions">
                                <a class="edit-button"
                                   th:href="@{/admin/restaurants/{restaurantId}/categories/{categoryId}/edit(restaurantId=${restaurant.id}, categoryId=${category.id})}">
                                    Изменить
                                </a>

                                <a class="edit-button"
                                   th:href="@{/admin/restaurants/{restaurantId}/categories/{categoryId}/dishes(restaurantId=${restaurant.id}, categoryId=${category.id})}">
                                    Блюда
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <p th:if="${#lists.isEmpty(categories)}" class="empty-text">
                Категорий пока нет
            </p>

            <div class="form-actions">
                <a class="secondary-button" th:href="@{/admin/restaurants}">
                    Назад к ресторанам
                </a>
            </div>
        </div>
    </section>

</div>
</body>
</html>
