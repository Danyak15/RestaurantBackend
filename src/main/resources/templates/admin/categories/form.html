<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<body>
<div th:replace="~{admin/layout :: layout(${pageTitle}, ${breadcrumb}, ~{::section})}">

    <section>
        <div class="page-actions">
            <div>
                <h2 th:text="${pageTitle}">Категория</h2>
                <p th:text="'Ресторан: ' + ${restaurant.name}">Ресторан</p>
            </div>
        </div>

        <div class="admin-card form-card">
            <p class="form-error"
               th:if="${formError}"
               th:text="${formError}">
            </p>

            <form th:action="${formAction}" th:object="${request}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="form-group">
                    <label for="name">Название категории</label>
                    <input id="name"
                           type="text"
                           th:field="*{name}"
                           placeholder="Например: Салаты"
                           required>

                    <p class="field-error"
                       th:if="${#fields.hasErrors('name')}"
                       th:errors="*{name}">
                    </p>
                </div>

                <div class="form-group">
                    <label for="displayOrder">Порядок отображения</label>
                    <input id="displayOrder"
                           type="number"
                           min="0"
                           th:field="*{displayOrder}"
                           required>

                    <p class="field-error"
                       th:if="${#fields.hasErrors('displayOrder')}"
                       th:errors="*{displayOrder}">
                    </p>
                </div>

                <div class="form-actions">
                    <a class="secondary-button"
                       th:href="@{/admin/restaurants/{restaurantId}/categories(restaurantId=${restaurant.id})}">
                        Назад
                    </a>

                    <button class="primary-button" type="submit">
                        Сохранить
                    </button>
                </div>
            </form>
        </div>
    </section>

</div>
</body>
</html>
